<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sketch Board</title>
  <link rel="icon" type="image/x-icon" href="img/favicon.ico">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <div class="wrapper">
    <div class="menu__wrapper">
      <div class="menu">
        <h1 class="menu__heading">Sketch Board</h1>

        <button class="btn--tool menu__item shadow btn btn--small btn--brush switched-on">
          <i class="fa-solid fa-paintbrush"></i>
        </button>
        <button class="btn--tool menu__item shadow btn btn--small btn--eraser">
          <i class="fa-solid fa-eraser"></i>
        </button>

        <div class="menu__item shadow color__wrapper">
          <input type="color" class="color__input">
          <div class="color__hex">
            <p class="color__hex__hash">#</p>
            <input type="text" class="text-input color__hex__input" maxlength="6" size="6">
          </div>
          <button class="color__picker"><i class="fa-solid fa-eye-dropper"></i></button>
        </div>

        <button class="menu__item shadow btn btn--reset">Reset board</button>
        <button class="menu__item shadow btn btn--board">New board</button>
        <button class="menu__item shadow btn btn--grid">Toggle grid</button>

        <span class="label-title label__mode-title">Randomness mode</span>
        <button class="btn--mode menu__item shadow btn btn--small btn--classic switched-on">
          <i class="fa-solid fa-palette"></i>
        </button>
        <button class="btn--mode menu__item shadow btn btn--small btn--random">
          <i class="fa-solid fa-dice-five"></i>
        </button>
        <div class="menu__item label__mode">
          <span class="label__mode-opacity switched-on">Opacity</span>
          <span class="label__mode-hue">Hue</span>
        </div>

        <div class="menu__item slider__wrapper">
          <p>Base opacity</p>
          <input class="slider slider__opacity" type="range" min="0" max="100" step="1" value="100">
          <input class="text-input slider__label slider__opacity__label" type="text">
        </div>
        <div class="menu__item slider__wrapper">
          <p>Randomness</p>
          <input class="slider slider__randomness" type="range" min="0" max="100" step="1" value="0">
          <input class="text-input slider__label slider__randomness__label" type="text">
        </div>

        <div class="menu__item resolution__wrapper">
          <span class="label-title label__resolution-title">Image resolution</span>
          <div class="resolution-mode__wrapper">
            <label>
              <input class="resolution__radio resolution__radio-default" type="radio" name="resolution-mode"
                value="default"> Default
            </label>
            <label>
              <input class="resolution__radio resolution__radio-custom" type="radio" name="resolution-mode"
                value="custom"> Custom
            </label>
          </div>

          <div class="resolution-input__wrapper">
            <input type="tel" class="resolution__width-input" value="">
            <span class="resolution-display">x <span class="height-display"></span> px</span>
          </div>
        </div>

        <button class="menu__item shadow btn btn--save">Save image</button>
      </div>
    </div>
    <div class="grid__wrapper grid--on"></div>
  </div>
  <footer class="footer">
    <div class="footer__wrapper">
      <p>Designed and built by <a class="footer__name" href="https://github.com/pascard20">Łukasz Pasternak</a>
      </p>
      <a class="footer__link" href="https://github.com/pascard20/sketch-board"><i class="fa-brands fa-github"></i></a>
    </div>
  </footer>
</body>

</html>
